name: terraform

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, or to GitHub's settings: applying
# needs an admin token and stays a person's step.
permissions:
  contents: read

jobs:
  # The job name is the status check this repository requires on main.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Test
        run: terraform test
